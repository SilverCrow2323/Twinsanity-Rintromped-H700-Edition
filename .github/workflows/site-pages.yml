name: Field Guide site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/launcher/screenshots/**"
      - ".github/workflows/site-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/launcher/screenshots/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate the site
        run: |
          test -s site/index.html
          grep -q 'id="install"' site/index.html
          mkdir -p site-dist/assets/screenshots
          cp site/index.html site-dist/index.html
          cp docs/launcher/screenshots/*.png site-dist/assets/screenshots/
          sed -i 's#../docs/launcher/screenshots/#assets/screenshots/#g' site-dist/index.html
          test -s site-dist/assets/screenshots/launcher-setup-where.png
          grep -q 'assets/screenshots/launcher-setup-where.png' site-dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
