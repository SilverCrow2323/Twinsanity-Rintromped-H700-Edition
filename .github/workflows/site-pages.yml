name: Field Guide site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the MuOS-only player guide
        run: |
          test -s site/index.html
          grep -q 'id="install"' site/index.html
          grep -q 'MuOS only' site/index.html
          grep -q 'Allwinner H700' site/index.html
          grep -q 'diagnostic only' site/index.html
          ! grep -Eiq 'Windows|macOS|Linux desktop|PlayStation Vita' site/index.html
          mkdir -p site-dist
          cp site/index.html site-dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
