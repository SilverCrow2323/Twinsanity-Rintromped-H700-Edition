name: Twinsanity Rintromped H700

on:
  push:
    branches: [h700/porting]
    paths:
      - 'porting/h700/**'
      - 'CMakeLists.txt'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/engine/platform/host/platform.h'
      - 'engine/engine/platform/sdl/**'
      - 'engine/engine/render/backends/gl/**'
      - '.github/workflows/rintromped-h700.yml'
  pull_request:
    paths:
      - 'porting/h700/**'
      - 'CMakeLists.txt'
      - 'engine/CMakeLists.txt'
      - 'engine/cmake/**'
      - 'engine/engine/platform/host/platform.h'
      - 'engine/engine/platform/sdl/**'
      - 'engine/engine/render/backends/gl/**'
      - '.github/workflows/rintromped-h700.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file zip python3
      - name: Run host preflight tests
        run: |
          cd porting/h700
          chmod +x scripts/*.sh device/*.sh muos/TwinsanityRintromped/*.sh
          ./scripts/test-kit.sh
          python3 renderer/check_gles_shader_profile.py

  aarch64-package:
    runs-on: ubuntu-22.04
    needs: [host-checks, gles-renderer-compile]
    steps:
      - uses: actions/checkout@v7
      - name: Install host packaging and ELF tools
        run: sudo apt-get update && sudo apt-get install -y binutils file zip python3
      - name: Cross-build with Debian Bullseye sysroot
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/porting/h700 debian:bullseye-slim sh -lc '
            apt-get update &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu binutils libc6-dev-arm64-cross file &&
            chmod +x scripts/*.sh device/*.sh muos/TwinsanityRintromped/*.sh &&
            ./scripts/build-probe.sh
          '
      - name: Verify both ARM64 ELFs and GLIBC baseline
        run: |
          for binary in \
            porting/h700/dist/tw-rintromped-h700-probe \
            porting/h700/dist/tw-rintromped-h700-sdl-probe; do
            file "$binary"
            readelf -h "$binary" | grep -Eq 'Class:.*ELF64'
            readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
            max=$(readelf --version-info "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1 || true)
            echo "$binary maximum required GLIBC symbol: $max"
            test -z "$max" || test "$(printf '%s\n' "$max" GLIBC_2.31 | sort -V | tail -n 1)" = "GLIBC_2.31"
          done
      - name: Make cross-build output writable
        run: sudo chown -R "$(id -u):$(id -g)" porting/h700/dist
      - name: Package diagnostic muxapp on Ubuntu runner
        run: |
          chmod +x porting/h700/scripts/package-muxapp.sh
          porting/h700/scripts/package-muxapp.sh porting/h700/dist/Twinsanity-Rintromped-H700-Preflight.muxapp
      - uses: actions/upload-artifact@v7
        with:
          name: twinsanity-rintromped-h700-preflight
          path: |
            porting/h700/dist/tw-rintromped-h700-probe
            porting/h700/dist/tw-rintromped-h700-sdl-probe
            porting/h700/dist/Twinsanity-Rintromped-H700-Preflight.muxapp
          if-no-files-found: error
          retention-days: 14

  gles-renderer-compile:
    runs-on: ubuntu-22.04
    needs: host-checks
    steps:
      - uses: actions/checkout@v7
      - name: Install AArch64 compiler and GLES / SDL headers
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu cmake ninja-build libgles2-mesa-dev libsdl2-dev
      - name: Configure the real engine renderer for GLES 3.2
        run: |
          cmake -S porting/h700/renderer -B build/h700-gles -G Ninja \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
      - name: Compile renderer and SDL platform objects against GLES headers
        run: cmake --build build/h700-gles --target h700_gles_compile_check --parallel 2
